<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Queen!</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }

    .message {
      position: absolute;
      top: 20%;
      width: 100%;
      font-size: 2.5em;
      color: #ffccff;
      text-shadow: 2px 2px 8px #ff66cc;
    }
    .sub-message {
  display: block;
  font-size: 0.6em;
  margin-top: 20px;
  color: white;
  font-weight: normal;
}


    .footer {
      position: absolute;
      bottom: 5%;
      width: 100%;
      font-size: 1.5em;
      color: #ffffff;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  

  <canvas id="fireworks"></canvas>
  
  <div class="message">
  🎉 Happy Birthday Queen 🎂<br>
  <span class="sub-message">I love you! <br>
  Wishing you good health and plenty blessed wealth! 💕</span>
</div>
<div class="footer">With love, from Dudedah 💖</div>

  
 
  <script>
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const fireworks = [];
    const particles = [];

    class Firework {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height;
        this.targetY = Math.random() * canvas.height / 2;
        this.speedY = 7;
        this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
      }

      update() {
        this.y -= this.speedY;
        if (this.y <= this.targetY) {
          this.explode();
          return true;
        }
        return false;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }

      explode() {
        for (let i = 0; i < 50; i++) {
          particles.push(new Particle(this.x, this.y, this.color));
        }
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 2 + 1;
        this.angle = Math.random() * 2 * Math.PI;
        this.speed = Math.random() * 5 + 1;
        this.gravity = 0.05;
        this.friction = 0.98;
        this.color = color;
        this.alpha = 1;
      }

      update() {
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= 0.01;
        return this.alpha <= 0;
      }

      draw() {
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.05) {
        fireworks.push(new Firework());
      }

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.draw();
        if (f.update()) {
          fireworks.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.draw();
        if (p.update()) {
          particles.splice(i, 1);
        }
      }
    }

    animate();

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
